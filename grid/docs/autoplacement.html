<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auto-placement example</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      .wrapper {
        list-style: none;
        margin: 1em auto;
        padding: 0;
        max-width: 800px;
      }
      .wrapper li {
        border: 1px solid #ccc;
      }

      .wrapper li img {
        display: block;
        object-fit: cover;
        width: 100%;
        height: 100%;
      }
    </style>

    <style class="editable">
      .wrapper {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 10px;
        grid-auto-flow: dense;
      }

      .wrapper li.landscape {
        grid-column-end: span 2;
      }
    </style>
  </head>

  <body>
    <section class="preview">
      <ul class="wrapper">
        <li><img src="portrait.jpg" alt="placeholder" /></li>
        <li class="landscape"><img src="landscape.jpg" alt="placeholder" /></li>
        <li class="landscape"><img src="landscape.jpg" alt="placeholder" /></li>
        <li class="landscape"><img src="landscape.jpg" alt="placeholder" /></li>
        <li class="landscape"><img src="landscape.jpg" alt="placeholder" /></li>
        <li><img src="portrait.jpg" alt="placeholder" /></li>
        <li><img src="portrait.jpg" alt="placeholder" /></li>
        <li><img src="portrait.jpg" alt="placeholder" /></li>
      </ul>
    </section>

    <textarea class="playable playable-css" style="height: 200px">
.wrapper {
  display: grid;
  grid-template-columns: repeat(3, minmax(120px, 1fr));
  gap: 10px;
  grid-auto-flow: dense;
}

.wrapper li.landscape {
  grid-column-end: span 2;
}</textarea
    >

    <textarea class="playable playable-html" style="height: 300px">
<ul class="wrapper">
  <li><img src="portrait.jpg" alt="placeholder"></li>
  <li class="landscape"><img src="landscape.jpg" alt="placeholder"></li>
  <li class="landscape"><img src="landscape.jpg" alt="placeholder"></li>
  <li class="landscape"><img src="landscape.jpg" alt="placeholder"></li>
  <li class="landscape"><img src="landscape.jpg" alt="placeholder"></li>
  <li><img src="portrait.jpg" alt="placeholder"></li>
  <li><img src="portrait.jpg" alt="placeholder"></li>
  <li><img src="portrait.jpg" alt="placeholder"></li>
</ul></textarea
    >

    <div class="playable-buttons">
      <input id="reset" type="button" value="Reset" />
    </div>

    <div id="companion-text-container" style="margin: 10px 0; padding: 10px; border: 1px dashed #999; border-radius: 4px;">
      <label for="caption-input">Grid Item Label: </label>
      <input id="caption-input" type="text" value="Sample Item" />
      <div id="caption-display" style="font-weight: bold; margin-top: 6px;"></div>
    </div>
  </body>
  <script src="../playable.js"></script>
  <script>
    (function () {
      var input = document.getElementById("caption-input");
      var display = document.getElementById("caption-display");
      var resetBtn = document.getElementById("reset");
      if (input && display) {
        function renderText() {
          display.textContent = input.value;
        }
        input.addEventListener("input", renderText);
        renderText();

        if (resetBtn) {
          resetBtn.addEventListener("click", function () {
            input.value = "Sample Item";
            renderText();
          });
        }
      }
    })();
  </script>
</html>
