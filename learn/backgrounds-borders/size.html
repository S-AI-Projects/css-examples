<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backgrounds and Borders: background-size</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      .box {
        width: 500px;
        height: 300px;
        padding: 0.5em;
        border: 1px solid #ccc;
        margin: 20px;
        /* Base fallback color for browsers without background-size */
        background-color: #e2e8f0;
      }
    </style>

    <style class="editable">
      .box {
        background-image: url(balloons.jpg);
        background-repeat: no-repeat;
        background-size: 100px 10em;
      }

      @supports not (background-size: cover) {
        .box {
          background-color: #cbd5e1;
        }

        .box::after {
          content: "Your browser does not support background-size. The background image cannot be resized.";
          display: block;
          padding: 1em;
          color: #334155;
          font-style: italic;
        }
      }
    </style>
  </head>

  <body>
    <section class="preview">
      <div class="box"></div>
    </section>

    <textarea class="playable playable-css" style="height: 220px">
.box {
  background-image: url(balloons.jpg);
  background-repeat: no-repeat;
  background-size: 100px 10em;
}

@supports not (background-size: cover) {
  .box {
    background-color: #cbd5e1;
  }

  .box::after {
    content: "Your browser does not support background-size.";
    display: block;
    padding: 1em;
    color: #334155;
    font-style: italic;
  }
}</textarea
    >

    <textarea class="playable playable-html" style="height: 130px">
<div class="box"></div></textarea
    >

    <div class="playable-buttons">
      <input id="reset" type="button" value="Reset" />
    </div>
  </body>
  <script src="../playable.js"></script>
</html>
