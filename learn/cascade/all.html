<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>all</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      #support-notice {
        display: none;
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        padding: 8px 12px;
        margin: 10px 0;
        border-radius: 4px;
        font-size: 0.9em;
      }

      @supports not (all: unset) {
        #support-notice {
          display: block;
        }
      }

      .unsupported-feature #support-notice {
        display: block;
      }
    </style>

    <style class="editable">
      blockquote {
        background-color: orange;
        border: 2px solid blue;
      }

      .fix-this {
        all: unset;
      }
    </style>
  </head>

  <body>
    <div id="support-notice">
      Note: The CSS <code>all</code> property is not supported in this browser.
    </div>
    <section class="preview">
      <blockquote>
        <p>This blockquote is styled</p>
      </blockquote>

      <blockquote class="fix-this">
        <p>This blockquote is not styled</p>
      </blockquote>
    </section>

    <textarea class="playable playable-css" style="height: 280px">
blockquote {
  background-color: orange;
  border: 2px solid blue;
}

.fix-this {
  all: unset;
}</textarea
    >

    <textarea class="playable playable-html" style="height: 140px">
<blockquote>
  <p>This blockquote is styled</p>
</blockquote>

<blockquote class="fix-this">
  <p>This blockquote is not styled</p>
</blockquote></textarea
    >

    <div class="playable-buttons">
      <input id="reset" type="button" value="Reset" />
    </div>
  </body>
  <script>
    if (!window.CSS || !CSS.supports || !CSS.supports("all", "unset")) {
      document.body.classList.add("unsupported-feature");
    }
  </script>
  <script src="../playable.js"></script>
</html>
