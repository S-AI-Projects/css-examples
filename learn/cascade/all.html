<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>all</title>
    <link rel="stylesheet" href="../styles.css" />
    <style></style>

    <style class="editable">
      blockquote {
        background-color: orange;
        border: 2px solid blue;
      }

      .fix-this {
        all: unset;
      }
    </style>
  </head>

  <body>
    <section class="preview">
      <blockquote>
        <p>This blockquote is styled</p>
      </blockquote>

      <blockquote class="fix-this">
        <p>This blockquote is not styled</p>
      </blockquote>
    </section>

    <textarea class="playable playable-css" style="height: 280px">
blockquote {
  background-color: orange;
  border: 2px solid blue;
}

.fix-this {
  all: unset;
}</textarea
    >

    <textarea class="playable playable-html" style="height: 140px">
<blockquote>
  <p>This blockquote is styled</p>
</blockquote>

<blockquote class="fix-this">
  <p>This blockquote is not styled</p>
</blockquote></textarea
    >

    <div class="playable-buttons">
      <input id="reset" type="button" value="Reset" />
    </div>
  </body>
  <script>
    // Deduplication guard for repeated script initialization
    function cleanDuplicateEditorHeadings() {
      const headings = Array.from(document.querySelectorAll("h4")).filter(
        (h) => h.textContent.trim() === "Interactive editor"
      );
      while (headings.length > 1) {
        headings.pop().remove();
      }
    }
    const headingObserver = new MutationObserver(cleanDuplicateEditorHeadings);
    headingObserver.observe(document.body, { childList: true });
    window.__pageCleanup = function () {
      headingObserver.disconnect();
    };
  </script>
  <script src="../playable.js"></script>
</html>
